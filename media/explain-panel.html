<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{CSP_NONCE}}' {{CSP_SOURCE}}; script-src 'nonce-{{CSP_NONCE}}' {{CSP_SOURCE}}; img-src data: {{CSP_SOURCE}};">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPLAIN Plan</title>
  <link rel="stylesheet" href="{{CSS_URI}}">
</head>
<body>
  <div class="explain-panel">
    <div class="header-bar">
      <div class="header-title">
        <span class="header-icon">&#x1F50D;</span>
        <span id="headerLabel">EXPLAIN Plan</span>
        <span class="header-sep">|</span>
        <span class="header-sql" id="headerSql" title=""></span>
      </div>
      <div class="toolbar">
        <button class="tb-btn active" id="btnVisual" data-action="switchView" data-action-arg="visual" title="Visual Tree">&#x1F333; Visual</button>
        <button class="tb-btn" id="btnTable" data-action="switchView" data-action-arg="table" title="Table View">&#x1F4CB; Table</button>
        <button class="tb-btn" id="btnJson" data-action="switchView" data-action-arg="json" title="JSON View">{ } JSON</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnAnalyze" data-action="runAnalyze" title="Run EXPLAIN ANALYZE">&#x26A1; Analyze</button>
      </div>
    </div>

    <div class="content-area">
      <div class="loading-area" id="loadingArea" style="display:none;">
        <div class="spinner"></div>
        <div class="loading-text">Running EXPLAIN...</div>
      </div>

      <div class="error-area" id="errorArea" style="display:none;">
        <div class="error-icon">&#x26A0;</div>
        <div class="error-message" id="errorMessage"></div>
      </div>

      <div class="view-container" id="visualView">
        <div class="tree-container" id="treeContainer"></div>
      </div>

      <div class="view-container" id="tableView" style="display:none;">
        <table class="explain-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Operation</th>
              <th>Table</th>
              <th>Rows</th>
              <th>Cost</th>
              <th>Key</th>
              <th>Extra</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="view-container" id="jsonView" style="display:none;">
        <pre class="json-pre" id="jsonPre"></pre>
      </div>
    </div>

    <div class="suggestions-area" id="suggestionsArea" style="display:none;">
      <div class="suggestions-header">
        <span class="suggestions-icon">&#x1F4A1;</span>
        <span>Optimization Suggestions</span>
      </div>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>
  </div>

  <script src="{{JS_URI}}"></script>
</body>
</html>
