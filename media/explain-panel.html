<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' {{CSP_SOURCE}}; script-src 'nonce-{{CSP_NONCE}}' {{CSP_SOURCE}}; img-src data: {{CSP_SOURCE}};">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="explainPanel.title">EXPLAIN Plan</title>
  <link rel="stylesheet" href="{{CSS_URI}}">
  {{CONFIG_INJECT}}
</head>
<body>
  <div class="explain-panel">
    <div class="header-bar">
      <div class="header-title">
        <span class="header-icon">&#x1F50D;</span>
        <span id="headerLabel" data-i18n="explainPanel.plan">EXPLAIN Plan</span>
        <span class="header-sep">|</span>
        <span class="header-sql" id="headerSql" title=""></span>
      </div>
      <div class="toolbar">
        <button class="tb-btn active" id="btnVisual" data-action="switchView" data-action-arg="visual" data-i18n="explainPanel.visual" data-i18n-title="explainPanel.visualTree" title="Visual Tree">&#x1F333; Visual</button>
        <button class="tb-btn" id="btnTable" data-action="switchView" data-action-arg="table" data-i18n="explainPanel.table" data-i18n-title="explainPanel.tableView" title="Table View">&#x1F4CB; Table</button>
        <button class="tb-btn" id="btnJson" data-action="switchView" data-action-arg="json" data-i18n="explainPanel.json" data-i18n-title="explainPanel.jsonView" title="JSON View">{ } JSON</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnAnalyze" data-action="runAnalyze" data-i18n="explainPanel.analyze" data-i18n-title="explainPanel.runAnalyze" title="Run EXPLAIN ANALYZE">&#x26A1; Analyze</button>
      </div>
    </div>

    <div class="content-area">
      <div class="loading-area" id="loadingArea" style="display:none;">
        <div class="spinner"></div>
        <div class="loading-text" data-i18n="explainPanel.running">Running EXPLAIN...</div>
      </div>

      <div class="error-area" id="errorArea" style="display:none;">
        <div class="error-icon">&#x26A0;</div>
        <div class="error-message" id="errorMessage"></div>
      </div>

      <div class="view-container" id="visualView">
        <div class="tree-container" id="treeContainer"></div>
      </div>

      <div class="view-container" id="tableView" style="display:none;">
        <table class="explain-table">
          <thead>
            <tr>
              <th data-i18n="explainPanel.id">ID</th>
              <th data-i18n="explainPanel.operation">Operation</th>
              <th data-i18n="explainPanel.tableCol">Table</th>
              <th data-i18n="explainPanel.rowsCol">Rows</th>
              <th data-i18n="explainPanel.costCol">Cost</th>
              <th data-i18n="explainPanel.keyCol">Key</th>
              <th data-i18n="explainPanel.extra">Extra</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="view-container" id="jsonView" style="display:none;">
        <pre class="json-pre" id="jsonPre"></pre>
      </div>
    </div>

    <div class="suggestions-area" id="suggestionsArea" style="display:none;">
      <div class="suggestions-header">
        <span class="suggestions-icon">&#x1F4A1;</span>
        <span data-i18n="explainPanel.suggestions">Optimization Suggestions</span>
      </div>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>
  </div>

  <script src="{{JS_URI}}"></script>
</body>
</html>
